<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1260" viewBox="0 0 2400 1260" role="img" aria-labelledby="mpeng-title mpeng-desc">
  <title id="mpeng-title">Mastering Prompt Engineering: Techniques and Hybrid Workflows</title>
  <desc id="mpeng-desc">A structured prompt specification with role, context, task, constraints, examples, and output format flows into a language model. The generated response is evaluated and refined through iterative prompting methods.</desc>

  <defs>
    <pattern id="mpeng-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="mpeng-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9282F8"/>
      <stop offset="1" stop-color="#F3CA4D"/>
    </linearGradient>
    <marker id="mpeng-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9" fill="none" stroke="#A1A1AA" stroke-width="1.2"/>
    </marker>
    <marker id="mpeng-arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9" fill="none" stroke="#F3CA4D" stroke-width="1.2"/>
    </marker>
    <style>
      .display { font-family: "Space Grotesk", "Inter", Arial, sans-serif; font-weight: 700; fill: #F4F4F5; }
      .sans { font-family: "Inter", Arial, sans-serif; fill: #F4F4F5; }
      .muted { fill: #A1A1AA; }
      .soft { fill: #D4D4D8; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #A1A1AA; }
      .eyebrow { font-family: "Inter", Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 5px; fill: #A1A1AA; }
      .label { font-family: "Inter", Arial, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 2px; fill: #D4D4D8; }
      .micro { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 20px; fill: #A1A1AA; letter-spacing: .5px; }
      .rule { stroke: #FFFFFF; stroke-opacity: .14; stroke-width: 2; fill: none; }
      .fine { stroke: #FFFFFF; stroke-opacity: .10; stroke-width: 1.5; fill: none; }
      .connector { stroke: #A1A1AA; stroke-opacity: .7; stroke-width: 2.5; fill: none; marker-end: url(#mpeng-arrow); }
      .accent-line { stroke: url(#mpeng-accent); stroke-width: 5; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Canvas -->
  <g id="mpeng-background">
    <rect width="2400" height="1260" fill="#0A0A0A"/>
    <rect x="120" y="80" width="2160" height="1100" fill="url(#mpeng-grid)"/>
    <path d="M120 80H2280M120 1180H2280M120 80V1180M2280 80V1180" stroke="#FFFFFF" stroke-opacity=".11" stroke-width="2" fill="none"/>
    <path d="M120 154H2280" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1.5"/>
    <path d="M120 1114H2280" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1.5"/>
  </g>

  <!-- Editorial zone -->
  <g id="mpeng-editorial">
    <text x="176" y="225" class="eyebrow">ENGINEERING DEEP DIVE</text>
    <rect x="176" y="254" width="12" height="12" fill="#F3CA4D"/>
    <text x="208" y="267" class="mono" font-size="22" letter-spacing="3">AI / DEVELOPER WORKFLOWS</text>

    <text x="170" y="420" class="display" font-size="100" letter-spacing="-3">Mastering Prompt</text>
    <text x="170" y="535" class="display" font-size="112" letter-spacing="-3">Engineering</text>

    <path d="M176 590H930" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="2"/>
    <text x="176" y="666" class="sans" font-size="42" font-weight="500">Techniques &amp; Hybrid Workflows</text>
    <text x="176" y="718" class="sans" font-size="42" font-weight="500">for Developers</text>

    <text x="176" y="817" class="sans muted" font-size="29">Turn vague requests into structured instructions,</text>
    <text x="176" y="860" class="sans muted" font-size="29">examples and constraints that guide useful AI output.</text>

    <g id="mpeng-editorial-meta">
      <path d="M176 938H904" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="2"/>
      <text x="176" y="984" class="mono" font-size="20" letter-spacing="2">PROMPT DESIGN</text>
      <circle cx="377" cy="977" r="4" fill="#F3CA4D"/>
      <text x="404" y="984" class="mono" font-size="20" letter-spacing="2">ITERATIVE WORKFLOWS</text>
    </g>
  </g>

  <!-- Diagram zone: structured prompt -->
  <g id="mpeng-diagram">
    <text x="1090" y="205" class="mono" font-size="20" letter-spacing="2">01 / SPECIFY THE REQUEST</text>

    <g id="mpeng-prompt-spec">
      <rect x="1088" y="236" width="600" height="620" rx="10" fill="#111111" stroke="#FFFFFF" stroke-opacity=".20" stroke-width="2"/>
      <path d="M1088 310H1688" class="rule"/>
      <text x="1130" y="283" class="label">PROMPT SPECIFICATION</text>
      <text x="1638" y="282" class="micro" text-anchor="end">INPUT</text>

      <!-- Field 1 -->
      <g id="mpeng-field-role">
        <text x="1130" y="354" class="mono" font-size="19" letter-spacing="1.5">01</text>
        <text x="1180" y="354" class="label">ROLE</text>
        <text x="1180" y="385" class="sans muted" font-size="22">Perspective and expertise</text>
        <path d="M1130 409H1648" class="fine"/>
      </g>
      <!-- Field 2 -->
      <g id="mpeng-field-context">
        <text x="1130" y="432" class="mono" font-size="19" letter-spacing="1.5">02</text>
        <text x="1180" y="432" class="label">CONTEXT</text>
        <text x="1180" y="463" class="sans muted" font-size="22">Background, users and environment</text>
        <path d="M1130 487H1648" class="fine"/>
      </g>
      <!-- Field 3 -->
      <g id="mpeng-field-task">
        <text x="1130" y="510" class="mono" font-size="19" letter-spacing="1.5">03</text>
        <text x="1180" y="510" class="label">TASK</text>
        <text x="1180" y="541" class="sans muted" font-size="22">A specific intended outcome</text>
        <path d="M1130 565H1648" class="fine"/>
      </g>
      <!-- Field 4 -->
      <g id="mpeng-field-constraints">
        <text x="1130" y="588" class="mono" font-size="19" letter-spacing="1.5">04</text>
        <text x="1180" y="588" class="label">CONSTRAINTS</text>
        <text x="1180" y="619" class="sans muted" font-size="22">Boundaries, exclusions and limits</text>
        <path d="M1130 643H1648" class="fine"/>
      </g>
      <!-- Field 5 -->
      <g id="mpeng-field-examples">
        <text x="1130" y="666" class="mono" font-size="19" letter-spacing="1.5">05</text>
        <text x="1180" y="666" class="label">EXAMPLES</text>
        <text x="1180" y="697" class="sans muted" font-size="22">Canonical input / output patterns</text>
        <path d="M1130 721H1648" class="fine"/>
      </g>
      <!-- Field 6 -->
      <g id="mpeng-field-format">
        <text x="1130" y="744" class="mono" font-size="19" letter-spacing="1.5">06</text>
        <text x="1180" y="744" class="label">OUTPUT FORMAT</text>
        <text x="1180" y="775" class="sans muted" font-size="22">Structure, length and delivery shape</text>
      </g>
      <rect x="1450" y="817" width="198" height="24" rx="3" fill="#FFFFFF" fill-opacity=".06"/>
      <text x="1549" y="835" class="micro" text-anchor="middle" font-size="15">ZERO-SHOT / FEW-SHOT</text>
    </g>

    <!-- Prompt to model connector -->
    <path d="M1688 544H1790" class="connector"/>
    <text x="1738" y="515" class="micro" text-anchor="middle">INSTRUCT</text>

    <!-- Language model -->
    <g id="mpeng-model">
      <text x="1808" y="315" class="mono" font-size="20" letter-spacing="2">02 / GENERATE</text>
      <rect x="1808" y="342" width="366" height="236" rx="10" fill="#111111" stroke="#FFFFFF" stroke-opacity=".20" stroke-width="2"/>
      <text x="1844" y="389" class="label">LANGUAGE MODEL</text>
      <text x="1844" y="420" class="micro">PROBABILISTIC GENERATION</text>

      <!-- token stream -->
      <g id="mpeng-token-stream">
        <rect x="1844" y="457" width="48" height="48" rx="4" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".28"/>
        <rect x="1904" y="457" width="48" height="48" rx="4" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".28"/>
        <rect x="1964" y="457" width="48" height="48" rx="4" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".28"/>
        <rect x="2024" y="457" width="48" height="48" rx="4" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".28"/>
        <path d="M1856 481H1880M1916 481H1940M1976 481H2000M2036 481H2060" stroke="#D4D4D8" stroke-width="2" stroke-linecap="round"/>
        <path d="M2078 481H2128" class="accent-line" stroke-width="3"/>
      </g>
      <text x="1844" y="545" class="micro">NEXT-TOKEN PREDICTION</text>
    </g>

    <!-- model to output -->
    <path d="M1991 578V635" class="connector"/>

    <!-- Output -->
    <g id="mpeng-output">
      <text x="1808" y="680" class="mono" font-size="20" letter-spacing="2">03 / SHAPE THE RESULT</text>
      <rect x="1808" y="706" width="366" height="150" rx="10" fill="#111111" stroke="#FFFFFF" stroke-opacity=".20" stroke-width="2"/>
      <text x="1844" y="752" class="label">STRUCTURED OUTPUT</text>
      <path d="M1844 774H2138" class="fine"/>
      <text x="1844" y="813" class="sans muted" font-size="22">Code · Plan · Explanation</text>
      <circle cx="2118" cy="824" r="7" fill="#F3CA4D"/>
    </g>

    <!-- Iteration loop -->
    <g id="mpeng-refinement">
      <path d="M1991 856V914H1400V856" stroke="#A1A1AA" stroke-opacity=".72" stroke-width="2.5" fill="none" stroke-dasharray="8 8" marker-end="url(#mpeng-arrow)"/>
      <rect x="1540" y="889" width="315" height="48" rx="5" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="1.5"/>
      <text x="1698" y="920" class="mono" font-size="18" text-anchor="middle" letter-spacing="1">EVALUATE  /  REFINE</text>
      <text x="1991" y="963" class="micro" text-anchor="middle">SELF-ASK · REACT · REFLEXION · SELF-CONSISTENCY</text>
    </g>
  </g>

  <!-- Bottom process rail -->
  <g id="mpeng-journey-rail">
    <path d="M176 1050H2224" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>
    <text x="176" y="1094" class="mono" font-size="18" letter-spacing="2">THE PRACTICE</text>

    <g transform="translate(520 1085)">
      <circle cx="0" cy="-7" r="5" fill="#F3CA4D"/>
      <text x="22" y="0" class="label" font-size="20">SPECIFY</text>
    </g>
    <path d="M700 1078H790" stroke="#71717A" stroke-width="2" marker-end="url(#mpeng-arrow)"/>
    <g transform="translate(835 1085)">
      <circle cx="0" cy="-7" r="5" fill="#A1A1AA"/>
      <text x="22" y="0" class="label" font-size="20">CONTEXTUALIZE</text>
    </g>
    <path d="M1115 1078H1205" stroke="#71717A" stroke-width="2" marker-end="url(#mpeng-arrow)"/>
    <g transform="translate(1250 1085)">
      <circle cx="0" cy="-7" r="5" fill="#A1A1AA"/>
      <text x="22" y="0" class="label" font-size="20">ITERATE</text>
    </g>
    <path d="M1430 1078H1520" stroke="#71717A" stroke-width="2" marker-end="url(#mpeng-arrow)"/>
    <g transform="translate(1565 1085)">
      <circle cx="0" cy="-7" r="5" fill="#9282F8"/>
      <text x="22" y="0" class="label" font-size="20">REFINE</text>
    </g>
    <text x="2222" y="1094" class="mono" font-size="18" text-anchor="end" letter-spacing="1">ANIKET RAJ / ENGINEERING NOTES</text>
  </g>

  <!-- Minimal accent rail -->
  <g id="mpeng-accent-marker">
    <rect x="120" y="80" width="300" height="4" fill="url(#mpeng-accent)"/>
    <rect x="2224" y="1176" width="56" height="4" fill="#F3CA4D"/>
  </g>
</svg>
