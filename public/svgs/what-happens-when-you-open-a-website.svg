<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1260" viewBox="0 0 2400 1260" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">What Happens When You Open a Website: From DNS to Rendering</title>
  <desc id="og-desc">A monochrome engineering diagram showing URL resolution, TCP and TLS connection setup, HTTP delivery through an edge cache or origin server, and the browser critical rendering path from HTML and CSS parsing to compositing.</desc>

  <defs>
    <pattern id="og-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <linearGradient id="og-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9282F8"/>
      <stop offset="1" stop-color="#F3CA4D"/>
    </linearGradient>
    <marker id="og-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#A1A1AA"/>
    </marker>
    <marker id="og-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#F3CA4D"/>
    </marker>
    <style>
      .eyebrow { font-family: Inter, Arial, sans-serif; font-size: 27px; font-weight: 600; letter-spacing: 4px; fill: #A1A1AA; }
      .title { font-family: 'Space Grotesk', Inter, Arial, sans-serif; font-size: 92px; font-weight: 600; letter-spacing: -2.5px; fill: #F4F4F5; }
      .title-sub { font-family: 'Space Grotesk', Inter, Arial, sans-serif; font-size: 61px; font-weight: 500; letter-spacing: -1.3px; fill: #A1A1AA; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 400; fill: #A1A1AA; }
      .panel-title { font-family: Inter, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 2.5px; fill: #F4F4F5; }
      .panel-index { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 23px; font-weight: 500; fill: #A1A1AA; }
      .node-title { font-family: Inter, Arial, sans-serif; font-size: 27px; font-weight: 600; fill: #F4F4F5; }
      .node-copy { font-family: Inter, Arial, sans-serif; font-size: 21px; font-weight: 400; fill: #A1A1AA; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 21px; fill: #D4D4D8; }
      .micro { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 1.8px; fill: #A1A1AA; }
      .rail-label { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 1.4px; fill: #A1A1AA; }
      .rail-step { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 600; fill: #F4F4F5; }
      .frame { fill: #0D0D0D; stroke: #FFFFFF; stroke-opacity: .14; stroke-width: 2; }
      .node { fill: #111111; stroke: #FFFFFF; stroke-opacity: .20; stroke-width: 2; }
      .line { fill: none; stroke: #777777; stroke-opacity: .72; stroke-width: 2.5; }
      .line-soft { fill: none; stroke: #FFFFFF; stroke-opacity: .18; stroke-width: 2; }
      .accent-line { fill: none; stroke: url(#og-accent); stroke-width: 3; }
    </style>
  </defs>

  <!-- Canvas and architectural framing -->
  <g id="background">
    <rect width="2400" height="1260" fill="#0A0A0A"/>
    <rect x="0" y="0" width="2400" height="1260" fill="url(#og-grid)"/>
    <path d="M56 0V1260M2344 0V1260" stroke="#FFFFFF" stroke-opacity=".11" stroke-width="2"/>
    <path d="M120 92H2280" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
    <path d="M120 92H380" stroke="url(#og-accent)" stroke-width="3"/>
    <text x="120" y="64" class="micro">ANIKET RAJ <tspan fill="#666666">/</tspan> TECHNICAL KNOWLEDGE</text>
    <text x="2280" y="64" text-anchor="end" class="micro">NETWORKING / WEB</text>
  </g>

  <!-- Editorial title zone -->
  <g id="editorial">
    <text x="120" y="205" class="eyebrow">ENGINEERING DEEP DIVE</text>
    <text x="120" y="340" class="title">What Happens When</text>
    <text x="120" y="452" class="title">You Open a Website</text>
    <text x="120" y="555" class="title-sub">From DNS to Rendering</text>
    <path d="M120 615H1110" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="2"/>
    <path d="M120 615H270" stroke="url(#og-accent)" stroke-width="3"/>
    <text x="120" y="690" class="subtitle">
      <tspan x="120" dy="0">One URL triggers a chain of network protocols,</tspan>
      <tspan x="120" dy="52">server decisions, and browser rendering stages.</tspan>
    </text>

    <g id="editorial-facts">
      <path d="M120 820V1070" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>
      <path d="M120 820V866" stroke="#F3CA4D" stroke-width="3"/>
      <text x="154" y="842" class="micro">01 / ESTABLISH</text>
      <text x="154" y="880" class="node-copy">Resolve the host and secure a connection.</text>
      <path d="M154 908H1040" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
      <text x="154" y="946" class="micro">02 / DELIVER</text>
      <text x="154" y="984" class="node-copy">Route the request through edge or origin.</text>
      <path d="M154 1012H1040" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
      <text x="154" y="1024" class="micro">03 / RENDER</text>
      <text x="154" y="1062" class="node-copy">Turn HTML and CSS into composited pixels.</text>
    </g>
  </g>

  <!-- Technical diagram zone -->
  <g id="technical-diagram">
    <text x="1260" y="152" class="micro">END-TO-END REQUEST LIFECYCLE</text>
    <path d="M1260 174H2280" stroke="#FFFFFF" stroke-opacity=".13" stroke-width="2"/>

    <!-- 01: DNS, TCP, TLS -->
    <g id="connection-stage">
      <rect x="1260" y="202" width="1020" height="220" rx="8" class="frame"/>
      <text x="1294" y="244" class="panel-index">01</text>
      <text x="1340" y="244" class="panel-title">RESOLVE &amp; CONNECT</text>
      <text x="2246" y="244" text-anchor="end" class="micro">BROWSER ↔ HOST</text>
      <path d="M1294 266H2246" class="line-soft"/>

      <rect x="1294" y="292" width="270" height="98" rx="5" class="node"/>
      <text x="1320" y="330" class="node-title">DNS</text>
      <text x="1320" y="363" class="node-copy">Hostname → IP address</text>
      <text x="1320" y="386" class="micro">CACHE / RESOLVER</text>

      <path d="M1564 341H1604" class="line" marker-end="url(#og-arrow)"/>
      <rect x="1614" y="292" width="270" height="98" rx="5" class="node"/>
      <text x="1640" y="330" class="node-title">TCP</text>
      <text x="1640" y="363" class="mono">SYN · SYN-ACK · ACK</text>
      <text x="1640" y="386" class="micro">3-WAY HANDSHAKE</text>

      <path d="M1884 341H1924" class="line" marker-end="url(#og-arrow)"/>
      <rect x="1934" y="292" width="312" height="98" rx="5" class="node"/>
      <text x="1960" y="330" class="node-title">TLS 1.3</text>
      <text x="1960" y="363" class="node-copy">Verify identity · derive keys</text>
      <text x="1960" y="386" class="micro">ENCRYPTED CHANNEL</text>
      <circle cx="2230" cy="311" r="5" fill="#F3CA4D"/>
    </g>

    <!-- 02: HTTP, edge, origin -->
    <g id="delivery-stage">
      <rect x="1260" y="446" width="1020" height="236" rx="8" class="frame"/>
      <text x="1294" y="488" class="panel-index">02</text>
      <text x="1340" y="488" class="panel-title">HTTP REQUEST &amp; DELIVERY</text>
      <text x="2246" y="488" text-anchor="end" class="micro">HTTP/1.1 · HTTP/2 · HTTP/3</text>
      <path d="M1294 510H2246" class="line-soft"/>

      <rect x="1294" y="538" width="212" height="98" rx="5" class="node"/>
      <text x="1400" y="574" text-anchor="middle" class="node-title">BROWSER</text>
      <text x="1400" y="608" text-anchor="middle" class="mono">GET /page</text>

      <path d="M1506 573H1570" class="line" marker-end="url(#og-arrow)"/>
      <text x="1538" y="552" text-anchor="middle" class="micro">REQUEST</text>

      <rect x="1580" y="538" width="250" height="98" rx="5" class="node"/>
      <text x="1705" y="574" text-anchor="middle" class="node-title">CDN / EDGE</text>
      <text x="1705" y="608" text-anchor="middle" class="node-copy">Cache lookup</text>
      <path d="M1600 624H1648" stroke="#F3CA4D" stroke-width="3"/>
      <text x="1662" y="630" class="micro" fill="#F3CA4D">CACHE HIT</text>

      <path d="M1830 573H1890" class="line" marker-end="url(#og-arrow)"/>
      <text x="1860" y="552" text-anchor="middle" class="micro">MISS</text>
      <rect x="1900" y="538" width="346" height="98" rx="5" class="node"/>
      <text x="2073" y="574" text-anchor="middle" class="node-title">ORIGIN SERVER</text>
      <text x="2073" y="608" text-anchor="middle" class="node-copy">Static file or dynamic SSR</text>

      <path d="M2073 636V646H1705V636" class="line" marker-end="url(#og-arrow)"/>
      <path d="M1705 636V655H1400V636" class="line" marker-end="url(#og-arrow)"/>
      <text x="1740" y="675" text-anchor="middle" class="micro">HTTP RESPONSE · STATUS + HEADERS + BODY</text>

    </g>

    <!-- 03: Browser critical rendering path -->
    <g id="rendering-stage">
      <rect x="1260" y="706" width="1020" height="298" rx="8" class="frame"/>
      <text x="1294" y="748" class="panel-index">03</text>
      <text x="1340" y="748" class="panel-title">BROWSER CRITICAL RENDERING PATH</text>
      <text x="2246" y="748" text-anchor="end" class="micro">HTML + CSS → PIXELS</text>
      <path d="M1294 770H2246" class="line-soft"/>

      <!-- Parallel parsing branches -->
      <rect x="1294" y="794" width="214" height="68" rx="5" class="node"/>
      <text x="1320" y="823" class="node-title">HTML</text>
      <text x="1320" y="848" class="node-copy">Parse → DOM</text>
      <rect x="1294" y="880" width="214" height="68" rx="5" class="node"/>
      <text x="1320" y="909" class="node-title">CSS</text>
      <text x="1320" y="934" class="node-copy">Parse → CSSOM</text>

      <path d="M1508 828H1550V850H1580" class="line" marker-end="url(#og-arrow)"/>
      <path d="M1508 914H1550V890H1580" class="line" marker-end="url(#og-arrow)"/>

      <rect x="1590" y="824" width="214" height="94" rx="5" class="node"/>
      <text x="1697" y="861" text-anchor="middle" class="node-title">RENDER TREE</text>
      <text x="1697" y="891" text-anchor="middle" class="node-copy">DOM + CSSOM</text>
      <path d="M1804 871H1840" class="accent-line" marker-end="url(#og-arrow-accent)"/>

      <!-- Final render stages -->
      <rect x="1852" y="824" width="112" height="94" rx="5" class="node"/>
      <text x="1908" y="861" text-anchor="middle" class="node-title">LAYOUT</text>
      <text x="1908" y="891" text-anchor="middle" class="micro">GEOMETRY</text>
      <path d="M1964 871H1984" class="line" marker-end="url(#og-arrow)"/>
      <rect x="1994" y="824" width="106" height="94" rx="5" class="node"/>
      <text x="2047" y="861" text-anchor="middle" class="node-title">PAINT</text>
      <text x="2047" y="891" text-anchor="middle" class="micro">PIXELS</text>
      <path d="M2100 871H2120" class="line" marker-end="url(#og-arrow)"/>
      <rect x="2130" y="824" width="116" height="94" rx="5" class="node"/>
      <text x="2188" y="861" text-anchor="middle" class="node-title" style="font-size:20px">COMPOSITE</text>
      <text x="2188" y="891" text-anchor="middle" class="micro">GPU FRAME</text>

      <path d="M1294 970H2246" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
      <text x="1294" y="988" class="micro">RESOURCE LOADING · CACHE · PREFETCH · COMPRESSION</text>
      <text x="2246" y="988" text-anchor="end" class="micro">FCP / LCP / LOAD</text>
    </g>
  </g>

  <!-- Bottom journey rail -->
  <g id="journey-rail">
    <path d="M120 1090H2280" stroke="#FFFFFF" stroke-opacity=".20" stroke-width="2"/>
    <path d="M120 1090H420" stroke="url(#og-accent)" stroke-width="3"/>
    <text x="120" y="1140" class="rail-label">THE JOURNEY</text>
    <g transform="translate(390 0)">
      <text x="0" y="1140" class="rail-step">URL</text>
      <path d="M58 1154H96" class="line" marker-end="url(#og-arrow)"/>
      <text x="118" y="1140" class="rail-step">DNS</text>
      <path d="M174 1154H212" class="line" marker-end="url(#og-arrow)"/>
      <text x="234" y="1140" class="rail-step">TCP + TLS</text>
      <path d="M365 1154H403" class="line" marker-end="url(#og-arrow)"/>
      <text x="425" y="1140" class="rail-step">HTTP</text>
      <path d="M492 1154H530" class="line" marker-end="url(#og-arrow)"/>
      <text x="552" y="1140" class="rail-step">DOM + CSSOM</text>
      <path d="M746 1154H784" class="line" marker-end="url(#og-arrow)"/>
      <text x="806" y="1140" class="rail-step">COMPOSITE</text>
    </g>

  </g>
</svg>
