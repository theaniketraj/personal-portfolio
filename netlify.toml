[build]
  publish = ".next"
  command = "npm run test:webmcp && npm run build && cp public/netlify-form.html .next/"

[build.environment]
  NODE_VERSION = "24.18.0"
  NEXT_TELEMETRY_DISABLED = "1"

# Form handling
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true